name: APK (main)

# Every push to main builds the app and publishes it to the "latest"
# pre-release: https://github.com/<owner>/<repo>/releases/tag/latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-main
  cancel-in-progress: true

jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Release keystore (optional)
        # set the repository secrets WRTPILOT_KEYSTORE_BASE64 (base64 of the
        # keystore file), WRTPILOT_KEYSTORE_PASSWORD, WRTPILOT_KEY_ALIAS and
        # WRTPILOT_KEY_PASSWORD to sign with your own key; otherwise the
        # shared debug key in android/app/debug.keystore is used
        env:
          KEYSTORE_B64: ${{ secrets.WRTPILOT_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WRTPILOT_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        env:
          WRTPILOT_VERSION_CODE: ${{ github.run_number }}
          WRTPILOT_VERSION_SUFFIX: -${{ github.run_number }}
          WRTPILOT_KEYSTORE_PASSWORD: ${{ secrets.WRTPILOT_KEYSTORE_PASSWORD }}
          WRTPILOT_KEY_ALIAS: ${{ secrets.WRTPILOT_KEY_ALIAS }}
          WRTPILOT_KEY_PASSWORD: ${{ secrets.WRTPILOT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:assembleDebug

      - name: Collect APKs
        id: apk
        run: |
          version="0.1.0-${{ github.run_number }}"
          out="$RUNNER_TEMP/apk"
          mkdir -p "$out"
          cp app/build/outputs/apk/release/app-release.apk "$out/wrtpilot-$version.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$out/wrtpilot-$version-debug.apk"
          ls -l "$out"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: wrtpilot-apk-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.dir }}/*.apk
          if-no-files-found: error

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.apk.outputs.version }}
          DIR: ${{ steps.apk.outputs.dir }}
        run: |
          short="${GITHUB_SHA::7}"
          notes="Automatic build of \`main\` at ${short} (WrtPilot ${VERSION}).

          - \`wrtpilot-${VERSION}.apk\`: the app (optimised build), install this one
          - \`wrtpilot-${VERSION}-debug.apk\`: debug build, for troubleshooting

          New builds install over older ones (same signature, higher version code).
          The router package is built by the *Router agent* workflow; see docs/INSTALL.md."
          gh release delete latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create latest "$DIR"/*.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease \
            --title "Latest build (main, ${VERSION})" --notes "$notes"
