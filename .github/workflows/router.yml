name: Router agent

on:
  push:
    paths:
      - 'router/**'
      - '.github/workflows/router.yml'
  pull_request:
    paths:
      - 'router/**'
      - '.github/workflows/router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (ucode ${{ matrix.ucode.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ucode:
          # as shipped by OpenWrt 23.05 / 24.10, and the latest upstream
          - { name: '2024-07-11', ref: 1a8a0bcf725520820802ad433db22d8f64fbed6c }
          - { name: 'master', ref: master }
    steps:
      - uses: actions/checkout@v7

      - name: Install build and test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libjson-c-dev libssl-dev \
            nftables iproute2 iperf3 dnsmasq-base curl

      - name: Build OpenWrt userland (libubox, ubus, uci, ucode, rpcd, uhttpd)
        run: sudo WORK="$RUNNER_TEMP/deps" router/tests/ci/build-deps.sh "${{ matrix.ucode.ref }}"

      - name: Lint
        run: python3 router/tests/lint_ucode.py

      - name: Unit tests
        run: router/tests/unit/run.sh ucode

      - name: Integration test (network namespaces)
        run: sudo router/tests/integration/run.sh

  package:
    name: Package (OpenWrt ${{ matrix.release }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 23.05 / 24.10 use opkg (.ipk), 25.12 uses apk (.apk)
        release: ['23.05.6', '24.10.8', '25.12.5']
    steps:
      - uses: actions/checkout@v7

      - name: Prepare feed
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          cp -r router "$RUNNER_TEMP/feed/wrtpilot"
          # every build gets a higher release number, so opkg/apk offer it as an update
          sed -i 's/^PKG_RELEASE:=.*/PKG_RELEASE:=${{ github.run_number }}/' "$RUNNER_TEMP/feed/wrtpilot/Makefile"

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: x86_64-${{ matrix.release }}
          FEED_DIR: ${{ runner.temp }}/feed
          FEEDNAME: wrtpilot
          PACKAGES: wrtpilot
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1
          # signed package index (the feed) when the signing keys are configured
          INDEX: ${{ secrets.WRTPILOT_FEED_USIGN_KEY != '' && '1' || '' }}
          KEY_BUILD: ${{ secrets.WRTPILOT_FEED_USIGN_KEY }}
          PRIVATE_KEY: ${{ secrets.WRTPILOT_FEED_APK_KEY }}

      - name: Collect package
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          pkg=$(find "$GITHUB_WORKSPACE/bin" \( -name 'wrtpilot_*.ipk' -o -name 'wrtpilot-[0-9]*.apk' \) | head -n1)
          test -n "$pkg"
          cp "$pkg" "$out/"
          # feed index (Packages* for opkg, packages.adb for apk), when built
          for f in Packages Packages.gz Packages.sig packages.adb; do
            [ ! -f "$(dirname "$pkg")/$f" ] || cp "$(dirname "$pkg")/$f" "$out/"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@v7
        with:
          name: wrtpilot-openwrt-${{ matrix.release }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  qemu:
    name: QEMU (OpenWrt ${{ matrix.release }})
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['23.05.6', '24.10.8', '25.12.5']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wrtpilot-openwrt-${{ matrix.release }}
          path: pkg

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils
          # let the runner user use KVM when the host offers it
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot OpenWrt, install the package, run the API smoke test
        env:
          WORK: ${{ runner.temp }}/qemu
        run: |
          mkdir -p "$WORK"
          router/tests/qemu/run.sh pkg/wrtpilot[_-]* "${{ matrix.release }}"

      - name: Upload console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-console-${{ matrix.release }}
          path: ${{ runner.temp }}/qemu/console.log

  publish:
    name: Publish router package
    # main only, and only once the packages passed on real OpenWrt
    if: github.ref == 'refs/heads/main'
    needs: [test, qemu]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SIGNED: ${{ secrets.WRTPILOT_FEED_USIGN_KEY != '' && secrets.WRTPILOT_FEED_APK_KEY != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wrtpilot-openwrt-*
          path: pkg

      - name: Publish to the "router-latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/pkgs" "$out/index"
          ipk_dir=pkg/wrtpilot-openwrt-23.05.6     # PKGARCH:=all: also serves 24.10
          apk_dir=pkg/wrtpilot-openwrt-25.12.5     # 25.12+
          ipk=$(basename "$(ls "$ipk_dir"/wrtpilot_*.ipk)")
          apk=$(basename "$(ls "$apk_dir"/wrtpilot-*.apk)")
          cp "$ipk_dir/$ipk" "$apk_dir/$apk" "$out/pkgs/"
          if [ "$SIGNED" = true ]; then
            cp "$ipk_dir/Packages" "$ipk_dir/Packages.gz" "$ipk_dir/Packages.sig" "$apk_dir/packages.adb" "$out/index/"
            feed=1
          else
            echo "::warning::Feed signing keys are not configured (secrets WRTPILOT_FEED_USIGN_KEY, WRTPILOT_FEED_APK_KEY): publishing the packages without a feed"
            feed=0
          fi
          sed -e "s/^FEED=.*/FEED=$feed/" -e "s/^IPK_FILE=.*/IPK_FILE=$ipk/" -e "s/^APK_FILE=.*/APK_FILE=$apk/" \
            router/install.sh > "$out/index/install.sh"
          version=${ipk#wrtpilot_}; version=${version%_all.ipk}
          ls -lR "$out"
          notes="WrtPilot router package ${version}, built from \`main\` at ${GITHUB_SHA::7} and tested on OpenWrt 23.05, 24.10 and 25.12.

          **Install or update**: on the router (SSH as root), run:

          \`\`\`
          wget -qO- https://github.com/${GITHUB_REPOSITORY}/releases/download/router-latest/install.sh | sh
          \`\`\`

          It adds this release as a signed OpenWrt package feed and installs the \`wrtpilot\` package, so later updates come with \`opkg upgrade\` (or LuCI > System > Software).
          Manual install: see [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/INSTALL.md).

          The phone app is in the [latest](https://github.com/${GITHUB_REPOSITORY}/releases/tag/latest) release."
          repo="--repo $GITHUB_REPOSITORY"
          if gh release view router-latest $repo >/dev/null 2>&1; then
            # update in place so the feed URL never disappears: packages first, then the index
            gh release upload router-latest "$out"/pkgs/* $repo --clobber
            gh release upload router-latest "$out"/index/* $repo --clobber
            keep=" $( (ls "$out/pkgs"; ls "$out/index") | tr '\n' ' ') "
            for a in $(gh release view router-latest $repo --json assets -q '.assets[].name'); do
              case "$keep" in *" $a "*) ;; *) gh release delete-asset router-latest "$a" $repo --yes ;; esac
            done
            gh release edit router-latest $repo --prerelease --title "Router package (${version})" --notes "$notes"
          else
            gh release create router-latest "$out"/pkgs/* "$out"/index/* $repo \
              --target "$GITHUB_SHA" --prerelease --title "Router package (${version})" --notes "$notes"
          fi

  verify:
    name: Published install (OpenWrt ${{ matrix.release }})
    # runs the one-line installer from the release, exactly as users do
    needs: publish
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['23.05.6', '25.12.5']
    steps:
      - uses: actions/checkout@v7

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot OpenWrt and run the published installer
        env:
          WORK: ${{ runner.temp }}/qemu
        run: |
          mkdir -p "$WORK"
          router/tests/qemu/run.sh online "${{ matrix.release }}"

      - name: Upload console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-console-online-${{ matrix.release }}
          path: ${{ runner.temp }}/qemu/console.log
