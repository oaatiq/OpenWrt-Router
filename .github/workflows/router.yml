name: Router agent

on:
  push:
    paths:
      - 'router/**'
      - '.github/workflows/router.yml'
  pull_request:
    paths:
      - 'router/**'
      - '.github/workflows/router.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: router-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (ucode ${{ matrix.ucode.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ucode:
          # as shipped by OpenWrt 23.05 / 24.10, and the latest upstream
          - { name: '2024-07-11', ref: 1a8a0bcf725520820802ad433db22d8f64fbed6c }
          - { name: 'master', ref: master }
    steps:
      - uses: actions/checkout@v7

      - name: Install build and test tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake pkg-config libjson-c-dev libssl-dev \
            nftables iproute2 iperf3 dnsmasq-base curl

      - name: Build OpenWrt userland (libubox, ubus, uci, ucode, rpcd, uhttpd)
        run: sudo WORK="$RUNNER_TEMP/deps" router/tests/ci/build-deps.sh "${{ matrix.ucode.ref }}"

      - name: Lint
        run: python3 router/tests/lint_ucode.py

      - name: Unit tests
        run: router/tests/unit/run.sh ucode

      - name: Integration test (network namespaces)
        run: sudo router/tests/integration/run.sh

  package:
    name: Package (OpenWrt ${{ matrix.release }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 23.05 / 24.10 use opkg (.ipk), 25.12 uses apk (.apk)
        release: ['23.05.6', '24.10.8', '25.12.5']
    steps:
      - uses: actions/checkout@v7

      - name: Prepare feed
        run: |
          mkdir -p "$RUNNER_TEMP/feed"
          cp -r router "$RUNNER_TEMP/feed/wrtpilot"

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v9
        env:
          ARCH: x86_64-${{ matrix.release }}
          FEED_DIR: ${{ runner.temp }}/feed
          FEEDNAME: wrtpilot
          PACKAGES: wrtpilot
          NO_REFRESH_CHECK: 1
          NO_SHFMT_CHECK: 1

      - name: Collect package
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          find "$GITHUB_WORKSPACE/bin" \( -name 'wrtpilot_*.ipk' -o -name 'wrtpilot-[0-9]*.apk' \) \
            -exec cp {} "$RUNNER_TEMP/out/" \;
          ls -l "$RUNNER_TEMP/out"
          test -n "$(ls "$RUNNER_TEMP/out")"

      - uses: actions/upload-artifact@v7
        with:
          name: wrtpilot-openwrt-${{ matrix.release }}
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  qemu:
    name: QEMU (OpenWrt ${{ matrix.release }})
    needs: package
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['23.05.6', '24.10.8', '25.12.5']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: wrtpilot-openwrt-${{ matrix.release }}
          path: pkg

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-system-x86 qemu-utils
          # let the runner user use KVM when the host offers it
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Boot OpenWrt, install the package, run the API smoke test
        env:
          WORK: ${{ runner.temp }}/qemu
        run: |
          mkdir -p "$WORK"
          router/tests/qemu/run.sh pkg/wrtpilot* "${{ matrix.release }}"

      - name: Upload console log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-console-${{ matrix.release }}
          path: ${{ runner.temp }}/qemu/console.log
